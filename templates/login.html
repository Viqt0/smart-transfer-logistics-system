{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-box">

        <h1>Smart Logistics</h1>

        <h2>Login</h2>

        <p class="auth-subtitle">
            Sign in to access your logistics portal.
        </p>

        <form method="post">

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Create an account</a>
        </p>

    </div>

</div>

{% endblock %}
