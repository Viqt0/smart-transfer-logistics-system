{% extends "base.html" %}{% block content %}<h1>New Delivery</h1>
<form class="form" method="post"><label>Customer<input name="customer" required></label><label>Phone<input name="phone"></label>
<label>Origin<input name="origin" required></label><label>Destination<input name="destination" required></label>
<label>Package Weight (kg)<input type="number" step="0.1" name="package_weight"></label><label>Package Size<input name="package_size" placeholder="Small / Medium / Large"></label>
<label>Priority<select name="priority"><option>Normal</option><option>Urgent</option></select></label>
<label>Date<input type="date" name="schedule_date" required></label><label>Time<input type="time" name="schedule_time" required></label>
<button class="btn">Create Delivery</button></form>{% endblock %}
