{% extends "base.html" %}{% block content %}<h1>Vehicle Maintenance</h1>
<form class="form" method="post"><label>Vehicle<select name="vehicle_id" required>{% for v in vehicles %}<option value="{{v.id}}">{{v.plate_no}} — {{v.type}}</option>{% endfor %}</select></label>
<label>Service Date<input type="date" name="service_date" required></label><label>Description<input name="description" required></label>
<label>Next Maintenance<input type="date" name="next_date"></label><label>Cost<input type="number" step="0.01" name="cost"></label><button class="btn">Record Maintenance</button></form>
<table><tr><th>Vehicle</th><th>Service Date</th><th>Description</th><th>Next Date</th><th>Cost</th></tr>{% for x in maintenance %}<tr><td>{{x.plate_no}}</td><td>{{x.service_date}}</td><td>{{x.description}}</td><td>{{x.next_date}}</td><td>{{x.cost}}</td></tr>{% endfor %}</table>{% endblock %}
